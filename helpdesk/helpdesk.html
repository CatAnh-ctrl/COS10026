<!doctype html>
<html>
  <a>
    <img src=logo.png>
  </a>
  <head>
    <meta charset="utf-8" />
    <meta
      name="description"
      content="Demonstrates some basic HTML form elements"
    />
    <meta name="keywords" content="HTML, Form, tags" />
    <meta name="author" content="A Lecturer" />
    <title>CWA Help Desk Appointment</title>
  </head>
  <body>
    <h1>CWA Help Desk Appointment</h1>

    <p>
      The Help Desk is located in ATC 620. Open 10:30 to 19:00 Monday to Friday
    </p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <form
      method="post"
      action="http://mercury.swin.edu.au/it000000/formtest.php"
    >
      <fieldset>
        <legend>Student Details</legend>
        <p>
          <label for="Student ID">Student ID</label>
          <input
            type="text"
            name="student_id"
            id="student_id"
            maxlength="20"
            size="10"
            required="required"
          />
        </p>
        <p>
          <label for="Given Name">Given Name</label>
          <input
            type="text"
            name="given_name"
            id="given_name"
            maxlength="20"
            size="10"
            required="required"
          />

          <label for="Family Name">Family Name</label>
          <input
            type="text"
            name="family_name"
            id="family_name"
            maxlength="20"
            size="10"
            required="required"
          />
          </fieldset>
        </p>

        <fieldset>
          <legend>Your unit</legend>
          <p>
            <label for="COS10011">COS10011</label>
            <input type="radio" id="COS10011" name="unit" value="COS10011" />

            <label for="COS10026">COS10026</label>
            <input type="radio" id="COS10026" name="unit" value="COS10026" />

            <label for="COS10009">COS10009</label>
            <input type="radio" id="COS10009" name="unit" value="COS10009" />
          </p>
        </fieldset>
        <fieldset>
          <legend>Issue</legend>
          <p>
            <label for="HTML">HTML</label>
            <input type="checkbox" id="HTML" name="category[]" value="HTML" />
          
            <label for="CSS">CSS</label>
            <input type="checkbox" id="CSS" name="category[]" value="CSS" />

            <label for="Java Script">Java Script</label>
            <input type="checkbox" id="Java Script" name="category[]" value="Java Script" />

            <label for="PHP">PHP</label>
            <input type="checkbox" id="PHP" name="category[]" value="PHP" />

            <label for="MySQL">MySQL</label>
            <input type="checkbox" id="MySQL" name="category[]" value="MySQL" />
          </p>
        <p>
          <label for="Description of Issue">Description of Issue</label>
          <br/>
          <textarea id="Description of Issue" name="Description of Issue" rows="4" cols="40" placeholder="Write your description of your problem here..."></textarea>
        </p>
      </fieldset>

<fieldset>
  <legend>Preferred Date / Time </legend>
  <p>
    <label for="date">date:</label>
    <input type="date" id="date" name="date" required
            placeholder="dd/mm/yyyy" 
                   pattern="([01][0-9]|2[0-9]|3[01])/(0[1-9]|1[012])/[0-9]{4}"  
                   title="Enter date in dd/mm/yyyy format" />
  </p>
  <p>
    <label for="time">time:</label>
    <input type="time" id="time" name="time" required
        placeholder="00:00" 
                   pattern='([01][0-9]|2[0-3]):[0-5][0-9]' 
                   title="Enter time in hh:mm format" />
  </p>

    </form>
  </body>
</html>
